<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2b5c8f">
  <title>Merriam-Webster 发音</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background-color: #f4f7f9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .container { width: 100%; max-width: 500px; background: #fff; margin-top: 30px; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h1 { font-size: 1.4rem; color: #1a365d; text-align: center; margin-bottom: 20px; }
    .config-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 16px; }
    .config-box label { font-size: 0.8rem; color: #475569; display: block; margin-bottom: 4px; }
    .config-box input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
    .search-box input { flex: 1; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; }
    .search-box button { padding: 0 16px; background: #2b5c8f; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .result-card { text-align: center; margin-top: 15px; display: none; }
    .word-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 10px; }
    .audio-btn { width: 60px; height: 60px; border-radius: 50%; background: #eff6ff; border: 2px solid #2b5c8f; color: #2b5c8f; font-size: 1.5rem; cursor: pointer; }
    .status-msg { text-align: center; font-size: 0.9rem; color: #64748b; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Merriam-Webster 单词发音</h1>
    <div class="config-box">
      <label for="apiKey">API Key:</label>
      <input type="text" id="apiKey" placeholder="粘贴 API Key" />
    </div>
    <div class="search-box">
      <input type="text" id="wordInput" placeholder="输入单词后按回车..." autofocus />
      <button id="searchBtn">播放</button>
    </div>
    <div class="result-card" id="resultCard">
      <div class="word-title" id="displayWord">--</div>
      <button class="audio-btn" id="playAudioBtn">🔊</button>
    </div>
    <div class="status-msg" id="statusMsg">输入单词并按回车</div>
  </div>

  <script>
    const wordInput = document.getElementById('wordInput');
    const searchBtn = document.getElementById('searchBtn');
    const apiKeyInput = document.getElementById('apiKey');
    const displayWord = document.getElementById('displayWord');
    const playAudioBtn = document.getElementById('playAudioBtn');
    const resultCard = document.getElementById('resultCard');
    const statusMsg = document.getElementById('statusMsg');

    let audio = new Audio();

    if (localStorage.getItem('mw_key')) {
      apiKeyInput.value = localStorage.getItem('mw_key');
    }
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('mw_key', apiKeyInput.value.trim());
    });

    function getAudioUrl(soundName) {
      let sub = 'number';
      if (soundName.startsWith('bix')) sub = 'bix';
      else if (soundName.startsWith('gg')) sub = 'gg';
      else if (isNaN(soundName.charAt(0)) && !soundName.startsWith('_')) sub = soundName.charAt(0).toLowerCase();
      return `https://media.merriam-webster.com/audio/prons/en/us/mp3/${sub}/${soundName}.mp3`;
    }

    async function playWord() {
      const word = wordInput.value.trim().toLowerCase();
      const key = apiKeyInput.value.trim();

      if (!word) { statusMsg.innerText = '请输入单词'; return; }
      if (!key) { statusMsg.innerText = '请输入 API Key'; return; }

      statusMsg.innerText = '查询中...';

      try {
        const res = await fetch(`https://www.dictionaryapi.com/api/v3/references/collegiate/json/${encodeURIComponent(word)}?key=${key}`);
        const data = await res.json();

        let soundName = null;
        if (Array.isArray(data) && data[0]?.hwi?.prs) {
          for (let pr of data[0].hwi.prs) {
            if (pr.sound?.audio) { soundName = pr.sound.audio; break; }
          }
        }

        if (!soundName) {
          statusMsg.innerText = '未找到该单词的标准发音';
          return;
        }

        const url = getAudioUrl(soundName);
        displayWord.innerText = word;
        resultCard.style.display = 'block';

        audio.src = url;
        audio.play();
        statusMsg.innerText = '播放成功';
      } catch (err) {
        statusMsg.innerText = '请求失败，请检查网络或 API Key';
      }
    }

    wordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') playWord();
    });
    searchBtn.addEventListener('click', playWord);
    playAudioBtn.addEventListener('click', () => audio.play());

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
